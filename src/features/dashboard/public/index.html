<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Panel de Control</title>
    <meta name="description"
        content="Dashboard de monitoreo en tiempo real para el estado de impresoras, niveles de tóner y bandejas de papel.">
    <link rel="icon" type="image/x-icon" href="ico.ico">
    <link rel="stylesheet" href="styles.css?v=4">
    <script src="app.js?v=4" defer></script>
</head>

<body>

    <!-- Header Principal -->
    <header>
        <div class="header-left">
            <div class="header-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <rect x="3" y="3" width="7" height="9" rx="1"></rect>
                    <rect x="14" y="3" width="7" height="5" rx="1"></rect>
                    <rect x="14" y="12" width="7" height="9" rx="1"></rect>
                    <rect x="3" y="16" width="7" height="5" rx="1"></rect>
                </svg>
            </div>
            <h1>Dashboard</h1>
        </div>
        <div class="header-right">
            <div class="update-time" id="last-update">
                <span>Sincronizando...</span>
            </div>
        </div>
    </header>

    <!-- Layout Principal de la Aplicación (Dos Columnas) -->
    <div class="app-layout">


        <!-- Contenedor Derecho: Contenido Principal -->
        <div class="app-content">
            <!-- Navegación de Pestañas -->
            <nav class="tabs-nav">
                <button class="tab-btn active" data-tab="tab-monitoreo" aria-label="Ver Monitoreo">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="9"></rect>
                        <rect x="14" y="3" width="7" height="5"></rect>
                        <rect x="14" y="12" width="7" height="9"></rect>
                        <rect x="3" y="16" width="7" height="5"></rect>
                    </svg>
                    <span>Monitoreo</span>
                </button>
                <button class="tab-btn" data-tab="tab-impresoras" aria-label="Configurar Impresoras">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 6 2 18 2 18 9"></polyline>
                        <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
                        <rect x="6" y="14" width="12" height="8"></rect>
                    </svg>
                    <span>Impresoras</span>
                </button>
            </nav>

            <!-- Pestaña 1: Monitoreo (Activa por defecto) -->
            <div id="tab-monitoreo" class="tab-content active-content">
                <!-- Barra de Controles/Acciones -->
                <div class="control-bar">
                    <div class="control-actions">
                        <!-- Botón Alternar KPIs -->
                        <button id="toggle-stats-btn" class="btn" title="Mostrar/Ocultar estadísticas de resumen"
                            aria-label="Alternar Panel de Estadísticas">
                            <svg class="icon-stats" viewBox="0 0 24 24">
                                <line x1="18" y1="20" x2="18" y2="10"></line>
                                <line x1="12" y1="20" x2="12" y2="4"></line>
                                <line x1="6" y1="20" x2="6" y2="14"></line>
                            </svg>
                            <span id="stats-btn-text">Ocultar Resumen</span>
                        </button>

                        <!-- Botón Alternar Vista (Tarjetas/Lista) -->
                        <button id="toggle-view-btn" class="btn" title="Cambiar distribución de pantalla"
                            aria-label="Cambiar Vista">
                            <svg id="view-icon" viewBox="0 0 24 24">
                                <!-- Icono dinámico en JS -->
                            </svg>
                            <span id="view-btn-text">Vista: Lista</span>
                        </button>
                    </div>

                    <!-- Botón Refresco Manual -->
                    <button id="refresh-btn" class="btn btn-primary" title="Refrescar estado actual"
                        aria-label="Actualizar datos">
                        <svg viewBox="0 0 24 24">
                            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
                        </svg>
                        <span>Actualizar</span>
                    </button>
                </div>

                <!-- Panel de Estadísticas (KPIs) -->
                <div id="stats-panel" class="stats-panel">
                    <div class="stats-grid">
                        <div class="stat-card online">
                            <div class="stat-card-title">Online</div>
                            <div class="stat-card-value" id="stat-online">-</div>
                        </div>
                        <div class="stat-card offline">
                            <div class="stat-card-title">Offline</div>
                            <div class="stat-card-value" id="stat-offline">-</div>
                        </div>
                        <div class="stat-card attention">
                            <div class="stat-card-title">Atención</div>
                            <div class="stat-card-value" id="stat-attention">-</div>
                        </div>
                    </div>
                </div>

                <!-- Contenedor Principal de Impresoras -->
                <main class="monitoreo-main">
                    <div id="printers-container" class="view-grid">
                        <!-- Renderizado dinámico desde JS -->
                    </div>
                </main>
            </div>

            <!-- Pestaña 2: Gestionar Impresoras -->
            <div id="tab-impresoras" class="tab-content">
                <div class="config-container">
                    <div class="config-header">
                        <h2>Parque de Impresión</h2>
                        <button id="add-printer-btn" class="btn btn-primary">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                            <span>Agregar Impresora</span>
                        </button>
                    </div>
                    <div class="table-responsive">
                        <table class="config-table">
                            <thead>
                                <tr>
                                    <th>Nombre</th>
                                    <th>Dirección IP</th>
                                    <th>Monitoreo</th>
                                    <th style="text-align:right;">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="printers-config-list">
                                <!-- Carga dinámica -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Modal Impresoras -->
            <div id="printer-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="printer-modal-title">
                <div class="modal-content">
                    <div class="modal-header">
                        <h3 id="printer-modal-title">Agregar Impresora</h3>
                        <span class="close-btn" id="close-printer-modal" role="button"
                            aria-label="Cerrar">&times;</span>
                    </div>
                    <form id="printer-form">
                        <input type="hidden" id="printer-original-ip">

                        <div class="form-group">
                            <label for="printer-ip">Dirección IP</label>
                            <input type="text" id="printer-ip" required placeholder="Ej: 10.160.104.170">
                        </div>

                        <div class="form-group">
                            <label for="printer-name">Nombre Comercial / Ubicación</label>
                            <input type="text" id="printer-name" required placeholder="Ej: Pasillo D/E (izq)">
                        </div>


                        <div class="form-switches">
                            <div class="switch-group">
                                <label class="switch">
                                    <input type="checkbox" id="printer-monitor-paper" checked>
                                    <span class="slider"></span>
                                </label>
                                <span class="switch-label">Monitorear Niveles de Papel</span>
                            </div>

                            <div class="switch-group">
                                <label class="switch">
                                    <input type="checkbox" id="printer-monitor-toner" checked>
                                    <span class="slider"></span>
                                </label>
                                <span class="switch-label">Monitorear Niveles de Tóner</span>
                            </div>
                        </div>

                        <div class="modal-actions">
                            <button type="button" class="btn" id="cancel-printer-btn">Cancelar</button>
                            <button type="submit" class="btn btn-primary">Guardar</button>
                        </div>
                    </form>
                </div>
            </div>




        </div>
    </div>

    <!-- SVG Icon Templates para reusar en JS -->
    <div style="display:none;">
        <!-- Copiar IP -->
        <svg id="svg-copy" viewBox="0 0 24 24">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
        <!-- Copiado Exitoso -->
        <svg id="svg-check" viewBox="0 0 24 24">
            <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        <!-- Tóner -->
        <svg id="svg-droplet" viewBox="0 0 24 24">
            <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path>
        </svg>
        <!-- Papel/Bandeja -->
        <svg id="svg-paper" viewBox="0 0 24 24">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
        <!-- Alerta/Offline -->
        <svg id="svg-alert" viewBox="0 0 24 24">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
            <line x1="12" y1="9" x2="12" y2="13"></line>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
    </div>
</body>

</html>
